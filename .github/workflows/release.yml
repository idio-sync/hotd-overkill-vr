# A pushed tag vX.Y.Z[-suffix]: the same build and tests as build.yml, then a GitHub Release for
# that tag with the players' zip, the PDB zip and their SHA-256 sums, its notes taken from the
# matching "## [X.Y.Z] - date" section of CHANGELOG.md (which must exist and be dated). A pre-release
# when the version has a '-' suffix or is 0.x. Run tools\release_check.ps1 before tagging (docs/DEVELOPMENT.md,
# "Releases"). This workflow never creates, moves or deletes tags.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version and release notes from CHANGELOG.md
        id: meta
        shell: powershell
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          $lines = Get-Content -LiteralPath CHANGELOG.md -Encoding UTF8
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match ('^## \[' + [regex]::Escape($version) + '\]')) { $start = $i; break }
          }
          if ($start -lt 0) { throw "CHANGELOG.md has no '## [$version]' section" }
          if ($lines[$start] -notmatch '\d{4}-\d{2}-\d{2}\s*$') { throw "CHANGELOG.md's [$version] section is not dated: $($lines[$start])" }
          $body = @()
          for ($i = $start + 1; $i -lt $lines.Count -and $lines[$i] -notmatch '^## '; $i++) { $body += $lines[$i] }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\notes.md", (($body -join "`n").Trim() + "`n"), (New-Object Text.UTF8Encoding $false))
          $pre = if ($version.Contains('-') -or $version.StartsWith('0.')) { 'true' } else { 'false' }
          "version=$version" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
          "prerelease=$pre" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
          "version $version, prerelease $pre"

      - name: MSVC x86 developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x86

      - name: Build (RelWithDebInfo, 32-bit)
        shell: cmd
        run: build.cmd

      - name: Unit tests
        run: ctest --test-dir out --output-on-failure

      - name: Package
        shell: powershell
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          .\tools\package.ps1 -NoBuild -Version $version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\tools\check_package.ps1 "out\dist\hotd-overkill-vr-$version.zip" -Annotate
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Content "out\dist\hotd-overkill-vr-$version.sha256"

      - name: GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          prerelease: ${{ steps.meta.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            out/dist/hotd-overkill-vr-${{ steps.meta.outputs.version }}.zip
            out/dist/hotd-overkill-vr-${{ steps.meta.outputs.version }}-pdb.zip
            out/dist/hotd-overkill-vr-${{ steps.meta.outputs.version }}.sha256
