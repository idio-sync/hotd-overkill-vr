; House of the Dead: Overkill VR - settings. The main ones are in README.md ("Settings"); every key:
; https://github.com/idio-sync/hotd-overkill-vr/blob/main/docs/SETTINGS.md
; Written by the mod at its first start; it never replaces this file. Delete it to get the defaults
; back (the mod writes it again at the next start).
[vr]
; openvr = VR through SteamVR; off = play flat (holding Shift while the game starts also plays flat)
mode=openvr
; eye image size: auto = SteamVR's recommended size times eye_scale (try 0.8 if it stutters)
eye_res=auto
eye_scale=1.0
; the controller that is the gun: right or left
hand=right
; degrees the aim is tilted up from the controller (change it if shots land above or below the barrel)
hand_pitch=0
; 1 = a small red dot where shots will land
marker=0
; the gun's own parts move (slide, hammer, cylinder, pump forend, trigger, ...); 0 = the gun stays still
gun_parts=1
; a flash at the muzzle on each shot (0 = off); how hard the drawn gun kicks (0 = off; shots still
; go where the barrel pointed); the gun hand's vibration on shots, hits, empty pulls and reloads (0 = off)
muzzle_flash=1
recoil=1.0
haptics=1.0
; comfort: 1 brings back the game's own camera shake, head-bob, and first-person arms during reloads
camera_shake=0
head_bob=0
game_arms=0
; comfort while the rail carries you: darken the edges of the view when it turns or moves fast
; (0 = off, 1 = black edges); it starts/is full at these turn speeds (degrees/s) and rail speeds (m/s)
comfort_vignette=0.6
vignette_turn_dps=30,120
vignette_move_mps=2,6
; soften the rail's turns: the view follows them over this many milliseconds (0 = off)
comfort_smooth_ms=150
; keep the horizon level: 0 = as the game tilts it, 1 = no sideways tilt, 2 = no tilt at all
comfort_level=1
