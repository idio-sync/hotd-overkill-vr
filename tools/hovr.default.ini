; House of the Dead: Overkill VR - settings. The main ones are in README.md ("Settings"); every key:
; https://github.com/idio-sync/hotd-overkill-vr/blob/main/docs/SETTINGS.md
; Written by the mod at its first start; it never replaces this file. Delete it to get the defaults
; back (the mod writes it again at the next start).
[vr]
; openvr = VR through SteamVR; off = play flat (holding Shift while the game starts also plays flat)
mode=openvr
; eye image size: auto = SteamVR's recommended size times eye_scale (try 0.8 if it stutters)
eye_res=auto
eye_scale=1.0
; the controller that is the gun: right or left
hand=right
; degrees the aim is tilted up from the controller (change it if shots land above or below the barrel)
hand_pitch=0
; 1 = a small red dot where shots will land
marker=0
; comfort: 1 brings back the game's own camera shake, head-bob, and first-person arms during reloads
camera_shake=0
head_bob=0
game_arms=0
